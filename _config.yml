# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: Xing's Blog
subtitle: ''
description: 'Sharing thoughts and experiences about technology, programming, and life'
keywords:
author: Jensen
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here.
url: https://winlee.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js

# Keep code block tools require Hexo highlight output; PrismJS remains disabled.
highlight:
  enable: true
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'empty'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
  - .nojekyll
exclude:
ignore:

# Extensions
theme: keep

# Deployment
deploy:
  type: git
  repo: https://github.com/winlee/winlee.github.io.git
  branch: master
  message: "Site updated"
